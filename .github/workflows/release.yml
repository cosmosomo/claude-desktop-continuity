name: Portable release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - shell: powershell
        run: |
          ./scripts/continuity/Build.ps1
          ./scripts/continuity/Package.ps1
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          prerelease: true
          name: v0.1.0 — Windows Preview
          body: |
            Windows x64 预览版：整合已保存的 Desktop 账号与本地 Code 会话选择、最近对话预览和接续操作。

            下载 ZIP，解压到固定目录，双击 Start.cmd；随后使用桌面“Claude账号与会话”快捷方式。

            已通过 Go 测试、go vet、应用编译和 23 项本机真实数据/界面检查。
            **整合界面的跨账号 A→B→A 实测待验收**：为保留当前正在运行的工作，本次没有重启 Desktop 做该测试。

            切换账号会重启 Desktop，请先完成或停止任务。只支持本地 Code 会话；详情见 README.md 与 VALIDATION.md。
